<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cập nhật đăng ký sự kiện · MANI Medical Hanoi</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<style>
/* Trang theo dõi tuyển sinh cho đối tác / NPP (doi-tac.html?k=<mã>) — chỉ SỐ ĐẾM, không thông tin khách. Backend marketing ▸ ehPartner (MKT_EventHubGate.gs). */
:root{--navy:#2C4A5E;--ink:#232C36;--ink2:#4F5B68;--ink3:#7D8894;--blue:#5A84A6;--pale:#E3EAF2;--line:#D6E2E9;--bg:#F3F6F9;--y:#FFE100;--warn:#A86A12;--ok:#3D7A5C;
  font-family:Aptos,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0}
header{background:#fff;border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;gap:12px;height:58px}
.logo{font:800 italic 22px/1 Aptos,"Arial Black",Arial,sans-serif;letter-spacing:-.02em;background:var(--y);color:#111;padding:6px 10px;border-radius:4px}
header span{color:var(--ink2);font-size:14px}
.w{max-width:880px;margin:0 auto;padding:0 18px}
main{padding:22px 0 40px}
h1{margin:0;font:700 22px/1.25 Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.01em;text-transform:uppercase;color:var(--navy)}
.sub{margin:6px 0 0;color:var(--ink2);font-size:14.5px}
.kick{display:inline-block;font:700 11px/1 Aptos,Arial;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--navy);padding:4px 8px;border-radius:4px;margin-bottom:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.t{background:var(--pale);border-radius:10px;padding:12px 14px}
.t span{display:block;font-size:12.5px;color:var(--ink2)}
.t b{display:block;font:700 30px/1.1 Aptos,Arial;color:var(--navy);margin-top:4px}
.t small{font-size:12px;color:var(--ink3)}
h2{margin:0 0 10px;font:700 13px/1.3 Aptos,Arial;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--pale);margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy)}
.lg{font-size:12.5px;color:var(--ink2)}
.mine{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mine .n{font:700 34px/1 Aptos,Arial;color:var(--navy)}
.mine .n span{font-size:16px;color:var(--ink3)}
svg{width:100%;height:auto;display:block}
.cg{stroke:var(--line)} .cy,.cx{font:11px Aptos,Arial;fill:var(--ink3);text-anchor:middle} .cy{text-anchor:end}
.cp{fill:none;stroke:var(--ink3);stroke-dasharray:5 4;stroke-width:1.6} .ca{fill:var(--blue);opacity:.14} .cl{fill:none;stroke:var(--navy);stroke-width:2.4}
.ctg{stroke:var(--navy);stroke-dasharray:2 3}
foot,footer{display:block;color:var(--ink3);font-size:12.5px;line-height:1.6;margin-top:18px}
.err{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--ink2);margin-top:30px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#E8EEF4,#F4F7FA,#E8EEF4);background-size:200% 100%;animation:s 1.2s infinite;margin:8px 0}
@keyframes s{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (max-width:620px){.grid{grid-template-columns:1fr 1fr}h1{font-size:19px}}
</style>
</head>
<body>
<header><div class="w"><span class="logo">MANI</span><span>MANI Medical Hanoi · Cập nhật đăng ký sự kiện</span></div></header>
<main class="w" id="m"><div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%"></div><div class="skel"></div></div></main>
<script>
var API = "https://script.google.com/macros/s/AKfycbzn-5chMgO7lQPKmot8P7UkP9C40MdCPtiTTa4H1gcKepVsnr1IYfcB7sSdK1_jrZYY/exec";   /* = EH_CFG.api của index.html */
</script>
<script>if (/[?&]demo=1/.test(location.search)) document.write('<script src="demo.js"><\/script>');</script>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); }, esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var k = (/[?&]k=([a-f0-9]{16})/.exec(location.search) || [])[1] || "";
  var DOW = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
  var d0 = function(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || "")); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  var iso = function(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); };
  var dmy = function(s){ var d = d0(s); return d ? DOW[d.getDay()] + ", " + ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear() : ""; };
  var T = new Date(); T = new Date(T.getFullYear(), T.getMonth(), T.getDate());
  var PACE = [[35, 0], [21, .3], [14, .5], [7, .8], [3, 1]];
  function fail(msg){ $("#m").innerHTML = '<div class="err"><b>' + esc(msg) + "</b><p>Vui lòng liên hệ Marketing — MANI Medical Hanoi.</p></div>"; }
  function bar(n, t, pace){ if (!t) return ""; return '<div class="bar"><i style="width:' + Math.min(100, n / t * 100).toFixed(1) + '%"></i>' + (pace ? '<b style="left:calc(' + Math.min(100, pace / t * 100).toFixed(1) + '% - 1px)"></b>' : "") + "</div>"; }
  function chart(d){
    var s = d0(d.event.start); if (!s) return "";
    var keys = Object.keys(d.days || {}).sort(), from = new Date(s); from.setDate(from.getDate() - 35); if (keys.length && d0(keys[0]) < from) from = d0(keys[0]);
    var to = new Date(s); to.setDate(to.getDate() + 1); var n = Math.round((to - from) / 864e5), run = 0, pts = [];
    for (var x = new Date(from); x <= T && x <= to; x.setDate(x.getDate() + 1)){ run += (d.days || {})[iso(x)] || 0; pts.push([new Date(x), run]); }
    if (!keys.length) return "";
    var W = 760, H = 230, pl = 38, pr = 14, pt = 16, pb = 26, ymax = Math.max(d.target || 0, d.reg, 10) * 1.1;
    var X = function(dt){ return pl + (W - pl - pr) * Math.round((dt - from) / 864e5) / n; }, Y = function(v){ return pt + (H - pt - pb) * (1 - v / ymax); };
    var g = [0, .5, 1].map(function(f){ var v = Math.round(ymax * f); return '<line class="cg" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="cy" x="' + (pl - 6) + '" y="' + (Y(v) + 4) + '">' + v + "</text>"; }).join("");
    var line = pts.map(function(p){ return X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1); }).join(" ");
    var area = "M" + X(pts[0][0]) + "," + Y(0) + " L" + line.replace(/ /g, " L") + " L" + X(pts[pts.length - 1][0]) + "," + Y(0) + "Z";
    var pace = d.target ? PACE.map(function(p){ var q = new Date(s); q.setDate(q.getDate() - p[0]); return X(q).toFixed(1) + "," + Y(d.target * p[1]).toFixed(1); }).join(" ") : "";
    var ticks = [-35, -21, -14, -7, 0].map(function(o){ var q = new Date(s); q.setDate(q.getDate() + o); if (q < from) return ""; return '<text class="cx" x="' + X(q) + '" y="' + (H - 8) + '">' + (o ? "D" + String(o).replace("-", "−") : "Ngày sự kiện") + "</text>"; }).join("");
    return '<div class="card"><h2>Số đăng ký theo ngày (tích luỹ)</h2><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Số đăng ký tích luỹ">' + g +
      (d.target ? '<line class="ctg" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(d.target) + '" y2="' + Y(d.target) + '"/>' : "") + (pace ? '<polyline class="cp" points="' + pace + '"/>' : "") +
      '<path class="ca" d="' + area + '"/><polyline class="cl" points="' + line + '"/>' + ticks + "</svg>" +
      '<p class="lg">Đường liền: số đăng ký tích luỹ · đường đứt: nhịp cần đạt để đủ mục tiêu trước sự kiện.</p></div>';
  }
  function show(d){
    if (!d || !d.ok) return fail(d && d.error || "Không tải được số liệu.");
    var e = d.event, left = d.dleft, P = d.partner || {};
    document.title = e.name + " · Cập nhật đăng ký · MANI Medical Hanoi";
    var h = '<span class="kick">' + esc(e.type || "Sự kiện") + (d.sample ? " · DỮ LIỆU MẪU" : "") + "</span><h1>" + esc(e.name) + '</h1><p class="sub">' + esc(dmy(e.start) + (e.end && e.end !== e.start ? " – " + dmy(e.end) : "")) +
      (e.venue || e.city ? " · " + esc([e.venue, e.city].filter(Boolean).join(", ")) : "") + (left != null && left >= 0 ? " · còn <b>" + left + " ngày</b>" : "") + "</p>";
    h += '<div class="card"><h2>Tình hình đăng ký</h2><div class="grid"><div class="t"><span>Tổng số đăng ký</span><b>' + d.reg + "</b><small>" + (d.target ? "mục tiêu " + d.target + " · đạt " + d.pct + "%" : "") + "</small></div>" +
      '<div class="t"><span>Nhịp cần đạt hôm nay</span><b>' + (d.target ? "≈ " + d.paceN : "—") + "</b><small>" + (d.target ? (d.reg >= d.paceN ? "đang đạt nhịp" : "còn thiếu " + Math.max(0, d.paceN - d.reg)) : "") + "</small></div>" +
      '<div class="t"><span>Đã xác nhận tham dự</span><b>' + (d.conf || "—") + "</b><small></small></div></div>" + bar(d.reg, d.target, d.paceN) + "</div>";
    if (P.n != null || P.quota) h += '<div class="card"><h2>Đăng ký qua ' + esc(P.name) + '</h2><div class="mine"><span class="n">' + (P.n == null ? "—" : P.n) + (P.quota ? "<span> / chỉ tiêu " + P.quota + "</span>" : "") + "</span>" +
      (P.quota && P.n != null ? '<span class="lg">' + Math.round(P.n / P.quota * 100) + "% chỉ tiêu</span>" : "") + "</div>" + (P.quota && P.n != null ? bar(P.n, P.quota) : "") + "</div>";
    h += chart(d);
    h += "<footer>Số liệu cập nhật " + (d.at ? "lúc " + esc(String(d.at).replace("T", " ").slice(0, 16)) : "định kỳ") + ". Trang này chỉ hiển thị số đếm, không có thông tin cá nhân của khách hàng.<br>Liên hệ: " + esc(d.owner || "Marketing") + " — Marketing, MANI Medical Hanoi (trả lời email thông báo đã nhận).</footer>";
    $("#m").innerHTML = h;
  }
  if (!k) return fail("Link chưa đúng.");
  var p = window.EH_DEMO ? window.EH_DEMO.api("ehPartner", { k: k }) : fetch(API, { method: "POST", body: JSON.stringify({ action: "ehPartner", k: k }), credentials: "omit" }).then(function(r){ if (!r.ok) throw new Error("Máy chủ lỗi " + r.status); return r.json(); });
  p.then(show).catch(function(e){ fail("Không tải được số liệu: " + (e.message || e)); });
})();
</script>
</body>
</html>
