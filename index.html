<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sự kiện MKT · MMH</title>
<meta name="description" content="Kế hoạch, giao việc và tiến độ sự kiện Marketing MMH FY68">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style id="eh-css">
/* Sự kiện MKT v2.0 — Bảng điều khiển (quản lý) · Lịch tháng · Sự kiện (thẻ ảnh) · Buồng điều phối Owner (hồ sơ sự kiện) · Việc của tôi.
   Màu: navy / blue MMH, vàng MANI chỉ làm điểm nhấn (hôm nay, ngày D). Màu sức khoẻ: xanh = đúng tiến độ, cam = cần chú ý, đỏ = chậm. */
:root{
  --paper:#F4F6F8; --surface:#FFFFFF; --sunk:#EDF1F4; --ink:#0D2431; --ink2:#4B5E6B; --ink3:#7B8C98; --line:#DDE3E9; --line2:#C3CDD8;
  --navy:#003047; --blue:#3A5CAA; --blue-s:#E8EEF9; --mani:#FFD200; --mani-ink:#161616;
  --t-exh:#3A5CAA; --t-ws:#0E7A6A; --t-sem:#9A5A12; --t-web:#6B4FA0; --t-oth:#5B6B7B;
  --ok:#2E7D4F; --ok-bg:#E3F2E8; --warn:#B26B00; --warn-bg:#FCF0D9; --crit:#B83A2E; --crit-bg:#FBE5E2; --wait:#6B4FA0; --wait-bg:#EFEAF7; --prog:#3A5CAA; --prog-bg:#E8EEF9;
  --focus:#3A5CAA; --shadow:0 18px 40px rgba(13,36,49,.18); --shadow-s:0 1px 2px rgba(13,36,49,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1720; --surface:#0F212D; --sunk:#152B39; --ink:#E6EDF1; --ink2:#A5B6C2; --ink3:#7690A0; --line:#1E3747; --line2:#2F4B5E;
  --navy:#D3E4F2; --blue:#93ACEB; --blue-s:#1A2C4A; --t-exh:#8EA8EA; --t-ws:#4FC2AE; --t-sem:#E0A35A; --t-web:#B49AE6; --t-oth:#9AA9B5;
  --ok:#5DBB86; --ok-bg:#16332A; --warn:#E3A847; --warn-bg:#3A2D12; --crit:#EE7A6E; --crit-bg:#3D1E1B; --wait:#B49AE6; --wait-bg:#2A2340; --prog:#93ACEB; --prog-bg:#1A2C4A;
  --focus:#93ACEB; --shadow:0 18px 40px rgba(0,0,0,.5); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
::selection{background:var(--mani);color:var(--mani-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
[hidden]{display:none!important}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.icon{padding:6px}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .btn.ok{color:#0A1720}
input.in,select.in,textarea.in{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
textarea.in{resize:vertical}
label.fl{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.h2{margin:0;font:700 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--navy)}
.sech{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.sech .sp{flex:1}
.sech small{color:var(--ink3);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-s)}
.cardp{padding:16px 18px}
.empty{padding:22px;color:var(--ink2);font-size:14px;text-align:center}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none;color:#fff;letter-spacing:.02em}
.av.s{width:22px;height:22px;font-size:9.5px}
.av.l{width:36px;height:36px;font-size:13px}
.av.none{background:var(--sunk)!important;color:var(--ink3);border:1.5px dashed var(--line2)}
.avs{display:flex}
.avs .av{box-shadow:0 0 0 2px var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--wait-bg);color:var(--wait)} .pill.prog{background:var(--prog-bg);color:var(--prog)} .pill.mut{background:var(--sunk);color:var(--ink2)}
.pill.sample{background:var(--mani);color:var(--mani-ink)}
.type{font-weight:600}
.type.exh{color:var(--t-exh)} .type.ws{color:var(--t-ws)} .type.sem{color:var(--t-sem)} .type.web{color:var(--t-web)} .type.oth{color:var(--t-oth)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;opacity:.75}
.bar.h12{height:12px;border-radius:6px} .bar.h12>i{border-radius:6px}
.bar.crit>i{background:var(--crit)} .bar.warn>i{background:var(--warn)}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface);font-weight:600}
.chip .n{font-size:11.5px;opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--ink2);border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--surface);font-weight:600}

/* thanh trên */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:9px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:6px}
.brand i{width:9px;height:26px;background:var(--mani);border-radius:2px}
.brand b{font:700 23px/1 var(--f-display);color:var(--navy);text-transform:uppercase;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--ink3)}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink2);font-size:14px;font-weight:500;padding:7px 11px;border-radius:8px;white-space:nowrap}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.badge.n{background:var(--sunk);color:var(--ink2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;width:240px}
.search input{border:0;outline:0;background:transparent;font-size:13.5px;width:100%}
.tbtn{position:relative;border:0;background:none;color:var(--ink2);padding:7px;border-radius:8px;display:inline-flex}
.tbtn:hover{background:var(--sunk);color:var(--ink)}
.tbtn .badge{position:absolute;top:0;right:-2px;min-width:16px;height:16px;font-size:10px}
.tbtn.spin .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.me{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.2;padding-left:6px}
.me small{color:var(--ink3);font-size:11.5px}
@media (max-width:1100px){.search{width:170px}.me>span{display:none}}
@media (max-width:860px){.top .wrap{flex-wrap:wrap;gap:6px 8px}.nav{order:5;width:100%;overflow-x:auto;padding-bottom:2px}.search{order:6;flex:1;width:auto}.brand span{display:none}}
.samplebar{background:var(--warn-bg);color:var(--warn);font-size:13px}
.samplebar .wrap{display:flex;gap:10px;align-items:center;padding-block:6px;flex-wrap:wrap}
.samplebar button{border:0;background:none;color:inherit;text-decoration:underline;font-weight:600;padding:0}
main{padding-block:20px 80px}

/* bảng điều khiển */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{border-color:var(--line2);background:color-mix(in srgb,var(--sunk) 40%,var(--surface))}
.kpi span{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi b{font:700 30px/1.05 var(--f-display);color:var(--ink)}
.kpi small{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.wait b{color:var(--wait)} .kpi.ok b{color:var(--ok)}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.evc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink);position:relative;transition:transform .15s,box-shadow .15s}
.evc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cov{position:relative;aspect-ratio:16/8;background:var(--sunk);overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov.contain{background:radial-gradient(circle at 70% 40%,#FFF6C2 0,#FFE566 55%,#F5CF1A 100%)}
.cov.contain img{object-fit:contain;padding:10px 18px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.cov .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,20,32,0) 40%,rgba(0,20,32,.62))}
.cov .dd{position:absolute;left:12px;bottom:10px;color:#fff;display:flex;align-items:flex-end;gap:10px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cov .dd b{font:700 34px/.85 var(--f-display)}
.cov .dd span{font:600 13px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.cov .tag{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.cov .tag .pill{box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cov .dbadge{position:absolute;right:10px;bottom:10px;background:var(--mani);color:var(--mani-ink);font:700 16px/1 var(--f-display);padding:5px 8px;border-radius:6px}
.cov .dbadge.past{background:rgba(255,255,255,.85)}
.evc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.evc h3{margin:0;font:600 15px/1.3 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.evc .meta{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.prow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.prow .bar{flex:1}
.prow b{font:700 18px/1 var(--f-display);min-width:42px;text-align:right}
.evc .ft{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:auto;padding-top:4px;font-size:12.5px;color:var(--ink2)}
.cnts{display:flex;gap:10px}
.cnts span{display:inline-flex;align-items:center;gap:4px}
.cnts .c{color:var(--crit);font-weight:600} .cnts .w{color:var(--wait);font-weight:600} .cnts .u{color:var(--warn);font-weight:600}
.dash2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-top:22px}
.dash3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:1150px){.dash2,.dash3{grid-template-columns:minmax(0,1fr)}}
.pvp{width:100%;border-collapse:collapse;font-size:13px}
.pvp td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.pvp tr:first-child td{border-top:0}
.pvp td.n{width:38%}
.pvp td.n a{color:var(--ink);text-decoration:none;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvp td.n a:hover{text-decoration:underline}
.pvp td.n small{display:block;color:var(--ink3);font-size:11.5px}
.pvp td.v{text-align:right;white-space:nowrap;width:110px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.todo{list-style:none;margin:0;padding:0}
.todo li+li{border-top:1px solid var(--line)}
.todo button.r{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;width:100%;padding:9px 4px;cursor:pointer;align-items:start}
.todo button.r:hover{background:var(--sunk)}
.todo .t{display:block;font-size:13.5px;font-weight:500;line-height:1.35}
.todo .s{display:block;font-size:12px;color:var(--ink3);margin-top:1px}
.todo .d{font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ink3);flex:none}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.wait{background:var(--wait)} .dot.none{background:transparent;border:1.5px solid var(--warn)} .dot.ok{background:var(--ok)} .dot.prog{background:var(--prog)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;font-size:13px;line-height:1.4}
.feed li+li{border-top:1px solid var(--line)}
.feed small{display:block;color:var(--ink3);font-size:11.5px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding-bottom:6px}
.thumb{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);text-decoration:none;color:var(--ink);cursor:pointer;text-align:left;padding:0}
.thumb .th{aspect-ratio:4/3;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
.thumb .th img{width:100%;height:100%;object-fit:cover}
.thumb .th .ico{width:26px;height:26px;color:var(--ink3);stroke-width:1.4}
.thumb .th.pdf{background:var(--crit-bg)} .thumb .th.pdf .ico{color:var(--crit)}
.thumb .th.link{background:var(--blue-s)} .thumb .th.link .ico{color:var(--blue)}
.thumb .cap{padding:6px 8px;font-size:12px;line-height:1.3;width:100%}
.thumb .cap b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .cap span{color:var(--ink3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font:500 11px var(--f-body);fill:var(--ink3)}
svg.chart .ax{stroke:var(--line);stroke-width:1}
svg.chart .today{stroke:var(--mani);stroke-width:2}
.heat-w{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:720px}
.heat th{font:600 11.5px/1.2 var(--f-body);color:var(--ink2);text-align:center;padding:4px 2px;vertical-align:bottom}
.heat th.ev{text-align:left;width:240px}
.heat td.ev{padding:4px 8px 4px 0}
.heat td.ev a{display:block;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.heat td.ev small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.heat td.c{height:36px;border-radius:5px;text-align:center;font-size:12px;position:relative;background:var(--sunk);color:var(--ink2);cursor:pointer}
.heat td.c:hover{outline:2px solid var(--ink3);outline-offset:-2px}
.heat td.c.na{background:transparent;cursor:default;color:var(--line2)}
.heat td.c.na:hover{outline:0}
.heat td.c.p1{background:#E6F0EA} .heat td.c.p2{background:#C8E3D1} .heat td.c.p3{background:#99CDAB;color:#0D2431} .heat td.c.p4{background:#5FAE7E;color:#fff} .heat td.c.p5{background:#2E7D4F;color:#fff;font-weight:600}
.heat td.c .od{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:var(--crit)}

/* lịch */
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.calbar h2{margin:0;font:700 28px/1 var(--f-display);text-transform:uppercase;color:var(--navy);min-width:210px}
.calbar .sp{flex:1}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--sunk)}
.cal-h div{padding:8px 10px;font:600 12px/1 var(--f-body);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.cal-w{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cal-w:last-child{border-bottom:0}
.cal-d{min-height:var(--rowh,118px);border-left:1px solid var(--line);padding:6px 8px;position:relative;cursor:pointer}
.cal-d:first-child{border-left:0}
.cal-d:hover{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.cal-d.out{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.cal-d.out .dn{color:var(--ink3)}
.cal-d.we .dn{color:var(--crit)}
.cal-d .dn{font:600 13px/1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%}
.cal-d.today .dn{background:var(--mani);color:var(--mani-ink)}
.cal-d.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.cal-d .dues{position:absolute;left:8px;right:8px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap;font-size:11px}

.approve{border:1px solid var(--wait);background:var(--wait-bg);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.approve b{flex:1;min-width:160px;color:var(--wait)}
.proof{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.proof-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sunk);font-size:13px;font-weight:600}
.proof-h .need{margin-left:auto}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
.plist .pt{width:52px;height:40px;border-radius:6px;background:var(--sunk);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;border:0;padding:0}
.plist .pt img{width:100%;height:100%;object-fit:cover}
.plist a{color:var(--ink);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.plist a:hover{text-decoration:underline}
.plist small{color:var(--ink3);font-size:11.5px}
.drop{margin:10px 12px 12px;border:1.5px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--ink2)}
.drop.on{border-color:var(--blue);background:var(--blue-s)}
.drop .btn{margin-top:6px}
.linkin{display:flex;gap:8px;padding:0 12px 12px}
.hist{list-style:none;margin:0;padding:0;font-size:12px;color:var(--ink2)}
.hist li{padding:4px 0;border-top:1px dashed var(--line)}
.hist li:first-child{border-top:0}
/* hộp thoại */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;background:rgba(10,23,32,.42);animation:fade .15s}
.mbox{width:min(760px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:none}
.mbox.sm{width:min(520px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font:700 22px/1 var(--f-display);text-transform:uppercase;color:var(--navy);flex:1}
.mb{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 14px 14px;flex-wrap:wrap}
.mf .sp{flex:1}
.covpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.covpick button{border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;aspect-ratio:16/10;background:var(--sunk)}
.covpick button img{width:100%;height:100%;object-fit:cover}
.covpick button[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-s)}
.prods{display:flex;gap:6px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0}
.tg input{width:18px;height:18px;accent-color:var(--blue)}
.fs{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fs legend{font:700 14px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--navy);padding:0 6px}
/* thông báo */
.pop{position:absolute;right:0;top:calc(100% + 6px);width:min(400px,92vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:45;padding:6px 14px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,12,18,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;animation:fade .15s}
.lb img{max-width:min(1200px,96vw);max-height:80vh;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lb .cap{color:#fff;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.lb .cap a{color:#FFD200}
.lb .nav2{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.lb .nav2:hover{background:rgba(255,255,255,.28)}
.lb .x{position:absolute;right:16px;top:14px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
/* đăng nhập */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .art{display:none}}
.login .art{position:relative;background:#0b2230;overflow:hidden}
.login .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.login .art div{position:absolute;left:40px;bottom:40px;right:40px;color:#fff}
.login .art b{display:block;font:700 54px/.95 var(--f-display);text-transform:uppercase}
.login .art i{display:inline-block;width:56px;height:6px;background:var(--mani);margin-bottom:14px}
.login .fm{display:grid;place-items:center;padding:24px 16px}
.login .card2{width:min(400px,100%)}
.login h1{margin:0 0 6px;font:700 34px/1 var(--f-display);text-transform:uppercase;color:var(--navy)}
.login p{margin:0 0 18px;color:var(--ink2);font-size:14px}
.login .row2{display:flex;flex-direction:column;gap:10px}
.login .err{color:var(--crit);font-size:13.5px;min-height:20px}
.codein{letter-spacing:.4em;font-size:22px!important;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;box-shadow:var(--shadow);max-width:min(560px,92vw)}
.toast.err{background:var(--crit);color:#fff}
.skel{height:14px;border-radius:4px;background:var(--sunk);margin:10px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.demo-note{background:var(--navy);color:var(--surface);font-size:12.5px;padding:5px 0;text-align:center}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;border-radius:999px;padding:12px 18px;box-shadow:var(--shadow);font-weight:600}
@media (min-width:861px){.fab{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    a.disabled = true; api("ehSave", { op: "cfg.save", rid: rid(), data: c }).then(function(d){ if (!d || !d.ok) throw new Error(d && d.error || "Không lưu được"); S.D.cfg = d.cfg; S.modal = null; render(); toast("Đã lưu cài đặt email / nhắc việc"); }).catch(function(x){ a.disabled = false; toast(x.message, true); }); return; }
  if (act === "previewdaily"){ a.disabled = true; a.textContent = "Đang tính…"; api("ehDaily", {}).then(function(d){ if (!d || !d.ok) throw new Error(d && d.error || "Không xem trước được");
    S.modal.prev = '<div class="card" style="margin-top:8px;padding:6px 12px">' + (d.items && d.items.length ? '<ul class="log">' + d.items.map(function(x){ return "<li><time>" + esc(x.to) + "</time><span>" + esc(x.subject) + (x.ok !== "Xem trước" ? ' <span class="pill warn">' + esc(x.ok) + "</span>" : "") + "</span></li>"; }).join("") + "</ul>" : '<p class="small muted">Hôm nay không có ai cần nhắc' + (d.skip ? " (" + esc(d.skip) + ")" : "") + ".</p>") + "</div>"; render(); })
    .catch(function(x){ toast(x.message, true); render(); }); return; }
  if (act === "syncnow"){ a.disabled = true; a.textContent = "Đang đồng bộ…"; api("ehSync", { force: 1 }).then(function(d){ if (!d || !d.ok) throw new Error(d && d.error || "Không đồng bộ được"); toast(d.message || "Đã đồng bộ"); S.modal = null; boot(false); }).catch(function(x){ toast(x.message, true); render(); }); return; }
  if (act === "sample"){ var op = a.dataset.op; if (op === "clear" && !a.dataset.confirm){ a.dataset.confirm = "1"; a.innerHTML = ic("trash") + "Bấm lần nữa để xoá"; return; }
    a.disabled = true; a.textContent = "Đang xử lý…"; api("ehSample", { op: op }).then(function(d){ if (!d || !d.ok) throw new Error(d && d.error || "Không thực hiện được");
      toast(op === "seed" ? "Đã nạp " + (d.seeded ? d.seeded.events + " sự kiện, " + d.seeded.tasks + " việc mẫu" : "dữ liệu mẫu") : "Đã xoá dữ liệu mẫu"); S.modal = null; S.hideSample = false; LS.set("eh_hidesample", null); boot(false); }).catch(function(x){ toast(x.message, true); render(); }); return; }
});
document.addEventListener("change", function(ev){
  var el = ev.target;
  if (el.dataset.team){ saveEvent(S.evId, (function(o){ o[el.dataset.team] = el.value; return o; })({}), el.value ? "Đã chọn " + el.value + " làm " + ROLE_VI[el.dataset.team] : "Đã bỏ " + ROLE_VI[el.dataset.team]); return; }
  if (el.dataset.upev){ upload(el.files, el.dataset.upev, ""); el.value = ""; return; }
  if (el.dataset.st){ var t0 = taskById(el.dataset.st); if (t0 && t0.status === "Chờ duyệt" && el.value === "Đang làm" && canEv(evById(t0.eventId)) && t0.pic !== me()){ S.modal = { k: "return", id: t0.id }; render(); return; } saveTask(el.dataset.st, { status: el.value }); return; }
  if (el.dataset.pic){ saveTask(el.dataset.pic, { pic: el.value }); return; }
  if (el.dataset.due){ saveTask(el.dataset.due, { due: el.value }, { quiet: true }); return; }
  if (el.dataset.rp !== undefined) return;
  if (el.id === "r-days"){ S.modal.days = +el.value; render(); return; }
  if (el.id === "dr-file"){ var t = taskById(S.drawer); upload(el.files, t.eventId, t.id); el.value = ""; return; }
  if (el.id === "dr-pic"){ var mail = $("#dr-mail"); saveTask(S.drawer, { pic: el.value }, { notify: mail ? mail.checked : true }); return; }
  if (el.id === "dr-due") saveTask(S.drawer, { due: el.value });
  if (el.id === "dr-proof") saveTask(S.drawer, { proof: el.value });
  if (el.id === "dr-prio") saveTask(S.drawer, { priority: el.checked ? "Cao" : "" });
});
document.addEventListener("focusout", function(ev){
  var el = ev.target, t = taskById(S.drawer); if (!t) return;
  if (el.id === "dr-note" && el.value !== (t.note || "")) saveTask(t.id, { note: el.value }, { quiet: true });
  if (el.id === "dr-title" && el.value.trim() && el.value.trim() !== t.title) saveTask(t.id, { title: el.value.trim() }, { quiet: true });
});
document.addEventListener("keydown", function(ev){
  var el = ev.target;
  if (ev.key === "Escape"){ if (S.lb){ S.lb = null; render(); return; } if (S.modal){ S.modal = null; render(); return; } if (S.pop){ S.pop = null; render(); return; } if (S.drawer){ S.drawer = null; render(); return; } }
  if (S.lb && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")){ S.lb.i = (S.lb.i + (ev.key === "ArrowRight" ? 1 : -1) + S.lb.list.length) % S.lb.list.length; render(); return; }
  if (ev.key === "Enter" && el.dataset && el.dataset.addsub && el.value.trim()){ var p = taskById(el.dataset.addsub), ps = $("#addp-" + p.id), pd = $("#addd-" + p.id);
    addTask({ eventId: p.eventId, parentId: p.id, group: p.group, role: p.role, title: el.value.trim(), pic: ps && ps.value ? ps.value : p.pic, due: pd ? pd.value : "" }); el.value = ""; return; }
  if (ev.key === "Enter" && el.id === "dr-link"){ addLink(S.drawer, el.value); return; }
  if (ev.key === "Enter" && el.id === "el-url"){ ev.preventDefault(); var b = $('[data-act="doevlink"]'); if (b) b.click(); return; }
  if (ev.key === "Enter" && el.id === "q-title"){ ev.preventDefault(); var b2 = $('[data-act="savequick"]'); if (b2) b2.click(); return; }
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey) && el.dataset && el.dataset.cbox){ ev.preventDefault(); if (el.value.trim()){ addComment(el.dataset.cbox, el.dataset.ctask || "", el.value); el.value = ""; } return; }
  if ((ev.key === "Enter" || ev.key === " ") && el.dataset && el.dataset.act === "fold"){ ev.preventDefault(); el.click(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k"){ ev.preventDefault(); var q = $("#q"); if (q) q.focus(); }
});
document.addEventListener("submit", function(ev){ ev.preventDefault(); });
document.addEventListener("input", function(ev){ if (ev.target.id === "q"){ S.q = ev.target.value; clearTimeout(S.qt); S.qt = setTimeout(function(){ if (S.q && !/events|mine/.test(S.view)){ location.hash = "events"; S.evf = "all"; return; } render(); }, 240); } });
/* Kanban: kéo thả đổi trạng thái */
document.addEventListener("dragstart", function(ev){ var c = ev.target.closest && ev.target.closest(".kc[data-kid]"); if (!c) return; S.kanDrag = c.dataset.kid; c.classList.add("drag"); try { ev.dataTransfer.setData("text/plain", c.dataset.kid); ev.dataTransfer.effectAllowed = "move"; } catch(x){} });
document.addEventListener("dragend", function(ev){ var c = ev.target.closest && ev.target.closest(".kc"); if (c) c.classList.remove("drag"); $$(".kcol.over").forEach(function(x){ x.classList.remove("over"); }); });
document.addEventListener("dragover", function(ev){ var col = ev.target.closest && ev.target.closest(".kcol"); if (!col || !S.kanDrag) return; ev.preventDefault(); $$(".kcol.over").forEach(function(x){ if (x !== col) x.classList.remove("over"); }); col.classList.add("over"); });
document.addEventListener("drop", function(ev){ var col = ev.target.closest && ev.target.closest(".kcol"); if (!col || !S.kanDrag) return; ev.preventDefault(); var id = S.kanDrag; S.kanDrag = null; col.classList.remove("over");
  var t = taskById(id), to = col.dataset.kcol; if (!t || (t.status || "Chưa làm") === to) return;
  if (t.status === "Chờ duyệt" && to === "Đang làm" && canEv(evById(t.eventId)) && t.pic !== me()){ S.modal = { k: "return", id: id }; render(); return; }
  saveTask(id, { status: to }); });
window.addEventListener("hashchange", route);

/* ═════════ ĐĂNG NHẬP ═════════ */
function renderLogin(msg){
  var email = LS.get("mmh_last_email") || "";
  $("#app").innerHTML = '<div class="login"><div class="art"><img src="' + esc(img("ws-comp-2.jpg")) + '" alt=""><div><i></i><b>Sự kiện MKT</b><span>Kế hoạch · giao việc · tiến độ sự kiện Marketing MMH</span></div></div><div class="fm"><form class="card2" id="lg" novalidate><h1>Đăng nhập</h1><p>Dùng email công ty. Mã 6 số sẽ gửi vào hộp thư của bạn. Đã đăng nhập Report Hub hoặc CRM trên trình duyệt này thì không cần đăng nhập lại.</p>' +
    '<div class="row2" id="lg-s1"><label class="fl" for="lg-email">Email công ty</label><input class="in" id="lg-email" type="email" autocomplete="email" value="' + esc(email) + '" placeholder="ten@manimedicalhanoi.com"><button class="btn pri" id="lg-send" type="submit">Gửi mã đăng nhập</button></div>' +
    '<div class="row2" id="lg-s2" hidden><label class="fl" for="lg-code">Mã 6 số trong email</label><input class="in codein" id="lg-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn pri" id="lg-ok" type="submit">Đăng nhập</button><button class="btn ghost" type="button" id="lg-back">Đổi email</button></div>' +
    '<p class="err" id="lg-err">' + esc(msg || "") + "</p></form></div></div>";
  var step = 1;
  $("#lg-back").onclick = function(){ step = 1; $("#lg-s1").hidden = false; $("#lg-s2").hidden = true; };
  $("#lg").onsubmit = function(ev){
    ev.preventDefault(); var err = $("#lg-err"), em = $("#lg-email").value.trim(); err.textContent = "";
    if (step === 1){
      if (!/@/.test(em)){ err.textContent = "Nhập email công ty."; return; }
      $("#lg-send").disabled = true; $("#lg-send").textContent = "Đang gửi…";
      AUTH.hub("rhAuthStart", { email: em }).then(function(d){ $("#lg-send").disabled = false; $("#lg-send").textContent = "Gửi mã đăng nhập";
        if (!d.ok){ err.textContent = d.error || "Không gửi được mã."; return; } step = 2; $("#lg-s1").hidden = true; $("#lg-s2").hidden = false; $("#lg-code").focus(); })
        .catch(function(e){ $("#lg-send").disabled = false; $("#lg-send").textContent = "Gửi mã đăng nhập"; err.textContent = e.message; });
    } else {
      var code = $("#lg-code").value.replace(/\D/g, ""); if (code.length !== 6){ err.textContent = "Mã gồm 6 chữ số."; return; }
      $("#lg-ok").disabled = true;
      AUTH.hub("rhAuthVerify", { email: em, code: code }).then(function(d){ $("#lg-ok").disabled = false;
        if (!d.ok){ err.textContent = d.error || "Mã không đúng."; return; } AUTH.save(d); boot(false); })
        .catch(function(e){ $("#lg-ok").disabled = false; err.textContent = e.message; });
    }
  };
}

/* ═════════ KHỞI ĐỘNG ═════════ */
function boot(manual){
  if (!window.EH_DEMO && !AUTH.get()){ renderLogin(); return; }
  if (!S.D) $("#app").innerHTML = '<main class="wrap" style="padding-top:40px"><div class="evgrid">' + [1, 2, 3, 4].map(function(){ return '<div class="card" style="padding:0;overflow:hidden"><div style="aspect-ratio:16/8;background:var(--sunk)"></div><div style="padding:14px"><div class="skel" style="width:70%"></div><div class="skel"></div></div></div>'; }).join("") + '</div><p class="muted" style="margin-top:14px">Đang tải sự kiện…</p></main>';
  var rb = $("#reload"); if (rb) rb.classList.add("spin");
  return api("ehBoot", {}).then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error || "Không tải được dữ liệu");
    var keepPending = S.D ? S.D.files.filter(function(f){ return /^tmp-/.test(f.id); }) : [];
    d.files = (d.files || []).concat(keepPending); d.comments = d.comments || []; d.log = d.log || []; d.notify = d.notify || [];
    S.D = d; S.me = d.me; S.loadedAt = Date.now();
    if (!S.routed){ S.routed = true; route(); } else render();
    if (manual) toast("Đã tải dữ liệu mới");
  }).catch(function(err){
    if (!S.D) $("#app").innerHTML = '<main class="wrap" style="padding-top:40px"><div class="card"><p class="empty">Không tải được dữ liệu: ' + esc(err.message) + '. <button class="btn sm" onclick="location.reload()">Thử lại</button></p></div></main>';
    else toast(err.message, true);
  }).then(function(){ var r2 = $("#reload"); if (r2) r2.classList.remove("spin"); });
}
setInterval(function(){ if (document.visibilityState === "visible" && S.D && !S.drawer && !S.modal && !S.lb && Date.now() - S.loadedAt > 90000 && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) boot(false); }, 30000);
window.EH = { S: S, boot: boot, render: render };
boot(false);
})();
