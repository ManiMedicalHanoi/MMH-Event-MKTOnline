<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sự kiện MKT · MMH</title>
<meta name="description" content="Kế hoạch, giao việc và tiến độ sự kiện Marketing MMH FY68">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style id="eh-css">
/* Sự kiện MKT — layout: thanh trên (điều hướng 3 màn) · Tổng quan (lịch mùa + bản đồ sự kiện × hạng mục + việc cần xử lý)
   · Việc của tôi · Hồ sơ sự kiện (tiến độ task lớn / task phụ, ấn phẩm, kế hoạch, nhật ký) · ngăn kéo việc bên phải.
   Điểm nhấn duy nhất: dải vàng MANI chứa ảnh sản phẩm trọng tâm của sự kiện. */
:root{
  --paper:#F3F5F7; --surface:#FFFFFF; --sunk:#E9EDF1; --ink:#0D2431; --ink2:#4B5E6B; --ink3:#7B8C98; --line:#D9E0E6;
  --navy:#003047; --blue:#3A5CAA; --mani:#FFD200; --mani-ink:#161616;
  --t-exh:#3A5CAA; --t-ws:#0E7A6A; --t-sem:#9A5A12; --t-web:#6B4FA0; --t-oth:#5B6B7B;
  --ok:#2E7D4F; --ok-bg:#E3F2E8; --warn:#A86A0C; --warn-bg:#FBF0DA; --crit:#B83A2E; --crit-bg:#FBE5E2; --wait:#6B4FA0; --wait-bg:#EFEAF7;
  --h1:#E6F0EA; --h2:#C8E3D1; --h3:#99CDAB; --h4:#5FAE7E; --h5:#2E7D4F;
  --focus:#3A5CAA; --shadow:0 12px 32px rgba(13,36,49,.18);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1720; --surface:#0F212D; --sunk:#152B39; --ink:#E6EDF1; --ink2:#A5B6C2; --ink3:#7690A0; --line:#1E3747;
  --navy:#D3E4F2; --blue:#93ACEB; --t-exh:#8EA8EA; --t-ws:#4FC2AE; --t-sem:#E0A35A; --t-web:#B49AE6; --t-oth:#9AA9B5;
  --ok:#5DBB86; --ok-bg:#16332A; --warn:#E3A847; --warn-bg:#3A2D12; --crit:#EE7A6E; --crit-bg:#3D1E1B; --wait:#B49AE6; --wait-bg:#2A2340;
  --h1:#173126; --h2:#1D4633; --h3:#256043; --h4:#2F8259; --h5:#45A874; --focus:#93ACEB; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1720; --surface:#0F212D; --sunk:#152B39; --ink:#E6EDF1; --ink2:#A5B6C2; --ink3:#7690A0; --line:#1E3747;
  --navy:#D3E4F2; --blue:#93ACEB; --t-exh:#8EA8EA; --t-ws:#4FC2AE; --t-sem:#E0A35A; --t-web:#B49AE6; --t-oth:#9AA9B5;
  --ok:#5DBB86; --ok-bg:#16332A; --warn:#E3A847; --warn-bg:#3A2D12; --crit:#EE7A6E; --crit-bg:#3D1E1B; --wait:#B49AE6; --wait-bg:#2A2340;
  --h1:#173126; --h2:#1D4633; --h3:#256043; --h4:#2F8259; --h5:#45A874; --focus:#93ACEB; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
::selection{background:var(--mani);color:var(--mani-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-size:14px;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input.in,select.in,textarea.in{border:1px solid #C3CDD8;background:var(--surface);border-radius:var(--r);padding:7px 10px;font-size:14px;width:100%}
:root[data-theme="dark"] input.in,:root[data-theme="dark"] select.in,:root[data-theme="dark"] textarea.in{border-color:#2F4B5E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) input.in,:root:not([data-theme="light"]) select.in,:root:not([data-theme="light"]) textarea.in{border-color:#2F4B5E}}
input.in:focus,select.in:focus,textarea.in:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
label.fl{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}

/* thanh trên */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px;text-decoration:none}
.brand b{font:700 25px/1 var(--f-display);color:var(--navy);text-transform:uppercase;letter-spacing:.01em}
.brand span{font-size:12.5px;color:var(--ink3)}
.nav{display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink2);font-size:14px;font-weight:500;padding:7px 11px;border-radius:var(--r)}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.badge.n{background:var(--sunk);color:var(--ink2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;width:260px}
.search input{border:0;outline:0;background:transparent;font-size:14px;width:100%}
.me{display:flex;align-items:center;gap:8px;font-size:13.5px}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--sunk);color:var(--navy);flex:none}
.sync{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sync button{border:0;background:none;color:var(--ink3);padding:4px;border-radius:6px}
.sync button:hover{color:var(--ink);background:var(--sunk)}
.sync.spin .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:980px){.top-r{margin-left:auto;gap:6px}.search{order:5;width:100%}.top .wrap{gap:10px}.nav{order:4;width:100%;overflow-x:auto}.sync span,.me>span:last-child{display:none}.top-r{display:contents}.me{margin-left:auto;order:2}.sync{order:3}}

main{padding-block:18px 64px}
h2.h{margin:0 0 10px;font:600 12.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.empty{padding:22px;color:var(--ink2);font-size:14px}

/* tổng quan */
.ov-line{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:16px;font-size:14px;color:var(--ink2)}
.ov-line b{font:700 26px/1 var(--f-display);color:var(--ink);margin-right:6px;vertical-align:-3px}
.ov-line .crit b{color:var(--crit)} .ov-line .warn b{color:var(--warn)} .ov-line .wait b{color:var(--wait)}
.rail-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:22px}
.rail{position:relative;min-width:880px;height:150px}
.month{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.month span{position:absolute;top:8px;left:8px;font:600 15px/1 var(--f-display);text-transform:uppercase;color:var(--ink3);letter-spacing:.03em}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--mani);z-index:2}
.today b{position:absolute;bottom:6px;left:6px;white-space:nowrap;font:600 11px/1 var(--f-body);background:var(--mani);color:var(--mani-ink);padding:3px 6px;border-radius:3px}
.mark{text-decoration:none;position:absolute;height:26px;border-radius:4px;border:0;padding:0 8px;display:flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);color:#fff;white-space:nowrap;z-index:3;overflow:hidden}
.mark i{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.9)}
.mark.tbc{border:1.5px dashed rgba(255,255,255,.85)}
.c-exh{background:var(--t-exh)} .c-ws{background:var(--t-ws)} .c-sem{background:var(--t-sem)} .c-web{background:var(--t-web)} .c-oth{background:var(--t-oth)}
:root[data-theme="dark"] .mark{color:#0A1720} :root[data-theme="dark"] .mark i{background:rgba(10,23,32,.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mark{color:#0A1720}:root:not([data-theme="light"]) .mark i{background:rgba(10,23,32,.7)}}
.ov-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media (max-width:1100px){.ov-grid{grid-template-columns:minmax(0,1fr)}}
.heat-w{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
.heat th{font:600 11.5px/1.2 var(--f-body);color:var(--ink2);text-align:center;padding:4px 2px;vertical-align:bottom}
.heat th.ev{text-align:left;width:260px}
.heat td.ev{padding:6px 8px 6px 0}
.heat td.ev a{display:block;text-decoration:none;color:var(--ink);font-weight:600;font-size:13.5px;line-height:1.3}
.heat td.ev small{display:block;font-size:12px;color:var(--ink3);font-weight:400;margin-top:2px}
.heat td.c{height:44px;border-radius:6px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;position:relative;background:var(--sunk);color:var(--ink2);cursor:pointer}
.heat td.c:hover{outline:2px solid var(--ink3);outline-offset:-2px}
.heat td.c.na{background:transparent;cursor:default;color:var(--ink3)}
.heat td.c.na:hover{outline:0}
.heat td.c.p1{background:var(--h1)} .heat td.c.p2{background:var(--h2)} .heat td.c.p3{background:var(--h3);color:var(--ink)} .heat td.c.p4{background:var(--h4);color:#fff} .heat td.c.p5{background:var(--h5);color:#fff;font-weight:600}
.heat td.c .od{position:absolute;left:5px;right:5px;bottom:4px;height:3px;border-radius:2px;background:var(--crit)}
.heat td.c .od+span{}
.heat td.tot{font-weight:600;text-align:right;padding-right:4px;white-space:nowrap}
.heat-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);margin-top:8px}
.heat-legend i{display:inline-block;width:16px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.side{display:flex;flex-direction:column;gap:22px}
.todo{list-style:none;margin:0;padding:0}
.todo li{border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.todo button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;width:100%;padding:10px 14px;cursor:pointer;align-items:start}
.todo button:hover{background:var(--sunk)}
.todo .t{display:block;font-size:14px;font-weight:500;line-height:1.35}
.todo .s{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.todo .d{font-size:12.5px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ink3)}
.dot.crit{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.wait{background:var(--wait)} .dot.none{background:transparent;border:1.5px solid var(--ink3)}
.people{width:100%;border-collapse:collapse;font-size:13.5px}
.people td{padding:7px 12px;border-top:1px solid var(--line)}
.people tr:first-child td{border-top:0}
.people .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);min-width:120px}
.people .bar i{display:block;height:100%}
.feed{list-style:none;margin:0;padding:6px 0}
.feed li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:8px 14px;font-size:13.5px;line-height:1.4}
.feed small{display:block;color:var(--ink3);font-size:12px}

/* việc của tôi */
.mine{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:980px}
.mgroup h3{margin:0 0 8px;font:700 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--navy);display:flex;gap:8px;align-items:baseline}
.mgroup h3 small{font:500 13px var(--f-body);color:var(--ink3);text-transform:none;letter-spacing:0}
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.tcard:first-child{border-top:0}
.tcard .tt{font-weight:600;font-size:14.5px;line-height:1.35;cursor:pointer}
.tcard .tt:hover{text-decoration:underline}
.tcard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink2);margin-top:3px}
.tcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.tcard{grid-template-columns:auto minmax(0,1fr)}.tcard .acts{grid-column:2;justify-content:flex-start}}

/* trạng thái */
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.chk:hover{border-color:var(--ok)}
.chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.skip{border-style:dashed}
.chk.wait{border-color:var(--wait)}
.chk .ico{width:13px;height:13px;stroke-width:2.6}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--wait-bg);color:var(--wait)} .pill.mut{background:var(--sunk);color:var(--ink2)}
.need{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.need.miss{color:var(--warn)}
.need .ico{width:13px;height:13px}

/* hồ sơ sự kiện */
.evlay{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.evlay{grid-template-columns:minmax(0,1fr)}}
.evlist{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:960px){.evlist{position:static;max-height:none;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}.evlist .row{min-width:250px}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;border-radius:var(--r);padding:10px;cursor:pointer;align-items:start}
.row:hover{background:var(--sunk)}
.row[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.dblock{font-family:var(--f-display);line-height:.95;color:var(--navy)}
.dblock .dd{font-size:24px;font-weight:700;display:block}
.dblock .mm{font-size:12px;font-weight:600;text-transform:uppercase;color:var(--ink3);letter-spacing:.04em}
.row h4{margin:0 0 3px;font:600 14px/1.3 var(--f-body)}
.row .meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--ink2)}
.row .pg{height:4px;border-radius:2px;background:var(--sunk);margin-top:6px;overflow:hidden}
.row .pg i{display:block;height:100%;background:var(--ok)}
.row.past{opacity:.6}
.type{font-weight:600}
.type.exh{color:var(--t-exh)} .type.ws{color:var(--t-ws)} .type.sem{color:var(--t-sem)} .type.web{color:var(--t-web)} .type.oth{color:var(--t-oth)}
.dossier{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:20px 24px 16px}
@media (max-width:640px){.d-head{grid-template-columns:1fr;padding:16px}}
.d-kick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:6px}
.d-title{margin:0;font:700 clamp(26px,2.8vw,38px)/1.04 var(--f-display);text-transform:uppercase;color:var(--navy);text-wrap:balance;max-width:34ch}
.d-sub{margin:8px 0 0;color:var(--ink2);font-size:14px;max-width:80ch}
.d-sub b{color:var(--ink);font-weight:600}
.dday{text-align:right;font-family:var(--f-display);color:var(--navy)}
.dday .big{font-size:58px;font-weight:700;line-height:.85;display:block}
.dday small{font:500 12px/1.3 var(--f-body);color:var(--ink3);display:block;margin-top:6px}
@media (max-width:640px){.dday{text-align:left}.dday .big{font-size:44px}}
.warnline{margin:10px 0 0;font-size:13px;color:var(--warn)}
.prod{background:var(--mani);color:var(--mani-ink);display:flex;overflow-x:auto}
.prod-l{flex:none;padding:14px 20px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(0,0,0,.12);min-width:150px}
.prod-l b{font:700 19px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.prod-l span{font-size:12px;margin-top:4px;opacity:.75}
.prod-i{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px 10px;min-width:140px;border-right:1px solid rgba(0,0,0,.12)}
.prod-i img{height:76px;width:auto;max-width:160px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.prod-i span{font:600 13.5px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.team{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 24px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.team .m{display:flex;align-items:center;gap:7px}
.team .m small{display:block;color:var(--ink3);font-size:11.5px;line-height:1.1}
.team .m b{font-weight:600;font-size:13.5px}
.team .m b.none{color:var(--warn);font-weight:500}
.team .m select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px;font-size:13px;max-width:150px}
@media (max-width:640px){.team{padding:12px 16px}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 10px 11px;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--navy)}
.tab .n{font-size:12px;color:var(--ink3);margin-left:4px}
.pbody{padding:18px 24px 26px}
@media (max-width:640px){.pbody{padding:14px 16px 22px}}
.tfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tfilter .sp{flex:1}

  var t = taskById(id); if (!t) return Promise.resolve();

  if (patch.status === "Xong" && !proofOk(Object.assign({}, t, patch))){ toast(t.proof === "link" ? "Dán link kết quả trước khi chuyển Xong." : "Tải file " + (t.proof === "image" ? "ảnh" : "ấn phẩm / tài liệu") + " lên trước khi chuyển Xong.", true); S.drawer = id; render(); setTimeout(function(){ var el = $(t.proof === "link" ? "#dr-link" : "#drop"); if (el) el.scrollIntoView({ block: "center" }); }, 50); return Promise.resolve(); }
  Object.assign(t, patch); if (patch.status === "Xong") t.doneAt = new Date().toISOString(); if ("due" in patch) t.dueManual = "x";
  render();
  return api("ehSave", { op: "task.update", rid: rid(), data: Object.assign({ id: id }, patch) }).then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error || "Không lưu được");
    Object.assign(t, d.task || {}); if (!(opts && opts.quiet)) toast(patch.status === "Xong" ? "Đã xong: " + t.title : "Đã lưu"); render();
  }).catch(function(err){ Object.assign(t, old); render(); toast(err.message, true); });
}
function addTask(data){
  var tmp = "tmp-" + Date.now(), t = Object.assign({ id: tmp, status: "Chưa làm", order: 999, createdBy: me() }, data);
  S.D.tasks.push(t); render();
  return api("ehSave", { op: "task.add", rid: rid(), data: t }).then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error || "Không thêm được");
    var i = S.D.tasks.indexOf(t); S.D.tasks[i] = d.task; S.D.tasks.forEach(function(x){ if (x.parentId === tmp) x.parentId = d.task.id; }); if (S.drawer === tmp) S.drawer = d.task.id; render(); return d.task;
  }).catch(function(err){ S.D.tasks.splice(S.D.tasks.indexOf(t), 1); render(); toast(err.message, true); });
}
function delTask(id){
  var keep = S.D.tasks.slice(); S.D.tasks = S.D.tasks.filter(function(t){ return t.id !== id && t.parentId !== id; }); S.drawer = null; render();
  api("ehSave", { op: "task.delete", rid: rid(), data: { id: id } }).then(function(d){ if (!d || !d.ok) throw new Error(d && d.error || "Không xoá được"); toast("Đã xoá việc"); })
    .catch(function(err){ S.D.tasks = keep; render(); toast(err.message, true); });
}
function saveEvent(id, patch){
  var e = evById(id), old = JSON.parse(JSON.stringify(e));
  Object.keys(patch).forEach(function(r){ if (S.D.roles && S.D.roles.indexOf(r) >= 0) S.D.tasks.forEach(function(t){ if (t.eventId === id && t.role === r && t.status !== "Xong" && (t.pic || "") === (old[r] || "")) t.pic = patch[r]; }); });
  Object.assign(e, patch); render();
  api("ehSave", { op: "event.update", rid: rid(), data: Object.assign({ id: id }, patch) }).then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error || "Không lưu được");
    (d.tasks || []).forEach(function(x){ var t = taskById(x.id); if (t) Object.assign(t, x); }); toast("Đã cập nhật đội sự kiện"); render();
  }).catch(function(err){ Object.assign(e, old); render(); toast(err.message, true); boot(true); });
}
function addLink(taskId, url){
  var t = taskById(taskId); url = String(url || "").trim();
  if (!/^https?:\/\//i.test(url)){ toast("Link phải bắt đầu bằng http:// hoặc https://", true); return; }
  var f = { id: "tmp-" + Date.now(), eventId: t.eventId, taskId: taskId, kind: "link", name: /facebook|fb\.watch/i.test(url) ? "Bài đăng Facebook" : url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0], url: url, by: me(), at: new Date().toISOString() };
  S.D.files.push(f); render();
  api("ehSave", { op: "link.add", rid: rid(), data: { eventId: t.eventId, taskId: taskId, url: url } }).then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error || "Không lưu được link"); S.D.files[S.D.files.indexOf(f)] = d.file; toast("Đã thêm link"); render();
  }).catch(function(err){ S.D.files.splice(S.D.files.indexOf(f), 1); render(); toast(err.message, true); });
}
function shrink(file){   /* ảnh lớn ⇒ JPEG ≤ 2400 px */
  return new Promise(function(res){
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5e6) return res(file);
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){ var k = Math.min(1, 2400 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file); }, "image/jpeg", .86); };
    img.onerror = function(){ res(file); }; img.src = url;
  });
}
function upload(files, evId, taskId){
  Array.prototype.slice.call(files || []).forEach(function(file0){
    if (file0.size > 25 * 1048576){ toast(file0.name + " lớn hơn 25 MB — tải lên Drive rồi dán link.", true); return; }
    shrink(file0).then(function(file){
      var tmp = { id: "tmp-" + Date.now() + Math.random(), eventId: evId, taskId: taskId || "", kind: /^image\//.test(file.type) ? "image" : "file", name: file.name + " (đang tải…)", url: "#", by: me(), at: new Date().toISOString() };
      if (tmp.kind === "image") tmp.thumb = URL.createObjectURL(file);
      S.D.files.push(tmp); render();
      var rd = new FileReader();
      rd.onload = function(){
        api("ehUpload", { rid: rid(), eventId: evId, taskId: taskId || "", name: file.name, mime: file.type || "application/octet-stream", data: String(rd.result).split(",")[1] }).then(function(d){
          if (!d || !d.ok) throw new Error(d && d.error || "Không tải lên được");
          if (tmp.thumb) d.file.thumb = d.file.thumb || tmp.thumb;
          S.D.files[S.D.files.indexOf(tmp)] = d.file; if (d.folderUrl){ var e = evById(evId); if (e && !e.folderUrl) e.folderUrl = d.folderUrl; } toast("Đã tải lên " + file.name); render();
        }).catch(function(err){ S.D.files.splice(S.D.files.indexOf(tmp), 1); render(); toast(file.name + ": " + err.message, true); });
      };
      rd.readAsDataURL(file);
    });
  });
}
function delFile(id){
  var f = S.D.files.filter(function(x){ return x.id === id; })[0]; if (!f) return;
  S.D.files.splice(S.D.files.indexOf(f), 1); render();
  api("ehSave", { op: "file.delete", rid: rid(), data: { id: id } }).then(function(d){ if (!d || !d.ok) throw new Error(d && d.error || "Không xoá được"); toast("Đã xoá " + f.name); })
    .catch(function(err){ S.D.files.push(f); render(); toast(err.message, true); });
}

/* ═════════ ĐIỀU HƯỚNG + VẼ ═════════ */
function route(){
  var h = location.hash.replace(/^#/, "");
  if (/^ev-/.test(h)){ S.view = "event"; if (S.evId !== h.slice(3)){ S.evId = h.slice(3); S.tab = "progress"; } }
  else if (h === "mine" || h === "events" || h === "overview") { S.view = h === "events" ? "event" : h; }
  else S.view = S.me && !S.me.manager ? "mine" : "overview";
  render();
}
function render(){
  if (!S.D) return;
  var scrollY = window.scrollY, dsc = $(".dr-b") ? $(".dr-b").scrollTop : 0, focusId = document.activeElement && document.activeElement.id;
  var body = S.view === "mine" ? vMine() : S.view === "event" ? vEvents() : vOverview();
  $("#app").innerHTML = shell() + '<main class="wrap">' + body + "</main>" + drawer();
  if (S.view === "overview") drawRail();
  window.scrollTo(0, scrollY); if ($(".dr-b")) $(".dr-b").scrollTop = dsc;
  if (focusId && $("#" + focusId)) { var el = $("#" + focusId); el.focus(); if (el.setSelectionRange && el.value) try { el.setSelectionRange(el.value.length, el.value.length); } catch(e){} }
  wireDrop();
}
function wireDrop(){
  var d = $("#drop"); if (!d) return; var t = taskById(S.drawer);
  ["dragenter", "dragover"].forEach(function(n){ d.addEventListener(n, function(ev){ ev.preventDefault(); d.classList.add("on"); }); });
  ["dragleave", "drop"].forEach(function(n){ d.addEventListener(n, function(ev){ ev.preventDefault(); d.classList.remove("on"); }); });
  d.addEventListener("drop", function(ev){ upload(ev.dataTransfer.files, t.eventId, t.id); });
}
document.addEventListener("paste", function(ev){
  if (!S.drawer || !ev.clipboardData) return; var t = taskById(S.drawer); if (!t || !canTask(t)) return;
  var fs = Array.prototype.slice.call(ev.clipboardData.files || []); if (!fs.length) return;
  ev.preventDefault(); upload(fs.map(function(f, i){ return new File([f], "Anh_dan_" + new Date().toISOString().slice(0, 19).replace(/\D/g, "") + "_" + (i + 1) + ".png", { type: f.type || "image/png" }); }), t.eventId, t.id);
});
document.addEventListener("click", function(ev){
  var a = ev.target.closest("[data-act],[data-open],[data-tab],[data-tf],[data-type],[data-ptab],[data-delfile],[data-status],td.c[data-ev],#reload"); if (!a) return;
  if (a.id === "reload"){ boot(true); return; }
  if (a.matches("td.c[data-ev]")){ S.evId = a.dataset.ev; S.tab = "progress"; S.tfilter = "all"; var key = a.dataset.ev + "|"; S.D.tasks.forEach(function(t){ if (t.eventId === a.dataset.ev && !t.parentId) S.closed[a.dataset.ev + "|" + t.id] = t.group !== a.dataset.g; }); location.hash = "ev-" + a.dataset.ev; return; }
  if (a.dataset.open){ S.drawer = a.dataset.open; render(); var f = a.dataset.focus; setTimeout(function(){ var el = f === "link" ? $("#dr-link") : f === "file" ? $("#drop") : null; if (el){ el.scrollIntoView({ block: "center" }); if (el.focus) el.focus(); } }, 30); return; }
  if (a.dataset.tab){ S.tab = a.dataset.tab; render(); return; }
  if (a.dataset.tf){ S.tfilter = a.dataset.tf; render(); return; }
  if (a.dataset.ptab){ S.ptab = a.dataset.ptab; render(); return; }
  if (a.dataset.type){ S.type = a.dataset.type; render(); return; }
  if (a.dataset.delfile){ delFile(a.dataset.delfile); return; }
  if (a.dataset.status){ saveTask(S.drawer, { status: a.dataset.status }); return; }
  var act = a.dataset.act, t = a.dataset.id ? taskById(a.dataset.id) : taskById(S.drawer);
  if (act === "close"){ S.drawer = null; render(); return; }
  if (act === "toggle" || act === "done"){ if (!t || !canTask(t)) return; saveTask(t.id, { status: act === "toggle" && t.status === "Xong" ? "Đang làm" : "Xong" }); return; }
  if (act === "fold"){ var sec = a.closest(".grp"), k = sec.dataset.key; S.closed[k] = !S.closed[k]; LS.set("eh_closed", JSON.stringify(S.closed)); sec.classList.toggle("closed"); a.setAttribute("aria-expanded", !S.closed[k]); return; }
  if (act === "addlink"){ addLink(t.id, $("#dr-link").value); return; }
  if (act === "deltask"){ if (a.dataset.confirm){ delTask(t.id); return; } a.dataset.confirm = "1"; a.innerHTML = ic("trash") + "Bấm lần nữa để xoá"; setTimeout(function(){ if (a.isConnected){ delete a.dataset.confirm; render(); } }, 4000); return; }
  if (act === "addsub"){ addTask({ eventId: t.eventId, parentId: t.id, group: t.group, role: t.role, title: "Việc mới", pic: t.pic }).then(function(n){ if (n){ S.drawer = n.id; render(); var x = $("#dr-title"); if (x){ x.focus(); x.select(); } } }); return; }
  if (act === "addgroup"){ var e = evById(S.evId), n = groupsOf(e.id).length + 1; addTask({ eventId: e.id, parentId: "", group: n + ". Hạng mục mới", title: "Hạng mục mới", role: "Owner", pic: e.Owner || "" }).then(function(x){ if (x){ S.drawer = x.id; render(); } }); return; }
});
document.addEventListener("change", function(ev){
  var el = ev.target;
  if (el.dataset.team){ saveEvent(S.evId, (function(o){ o[el.dataset.team] = el.value; return o; })({})); return; }
  if (el.dataset.upev){ upload(el.files, el.dataset.upev, ""); el.value = ""; return; }
  if (el.id === "dr-file"){ var t = taskById(S.drawer); upload(el.files, t.eventId, t.id); el.value = ""; return; }
  if (el.id === "dr-pic") saveTask(S.drawer, { pic: el.value });
  if (el.id === "dr-due") saveTask(S.drawer, { due: el.value });
  if (el.id === "dr-proof") saveTask(S.drawer, { proof: el.value });
});
document.addEventListener("focusout", function(ev){
  var el = ev.target, t = taskById(S.drawer); if (!t) return;
  if (el.id === "dr-note" && el.value !== (t.note || "")) saveTask(t.id, { note: el.value }, { quiet: true });
  if (el.id === "dr-title" && el.value.trim() && el.value.trim() !== t.title) saveTask(t.id, { title: el.value.trim() }, { quiet: true });
});
document.addEventListener("keydown", function(ev){
  var el = ev.target;
  if (ev.key === "Escape" && S.drawer){ S.drawer = null; render(); return; }
  if (ev.key === "Enter" && el.dataset && el.dataset.addsub && el.value.trim()){ var p = taskById(el.dataset.addsub); addTask({ eventId: p.eventId, parentId: p.id, group: p.group, role: p.role, title: el.value.trim(), pic: p.pic }); el.value = ""; return; }
  if (ev.key === "Enter" && el.id === "dr-link"){ addLink(S.drawer, el.value); return; }
  if ((ev.key === "Enter" || ev.key === " ") && el.dataset && el.dataset.act === "fold"){ ev.preventDefault(); el.click(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k"){ ev.preventDefault(); var q = $("#q"); if (q) q.focus(); }
});
document.addEventListener("input", function(ev){ if (ev.target.id === "q"){ S.q = ev.target.value; clearTimeout(S.qt); S.qt = setTimeout(function(){ if (S.view === "overview" && S.q) { location.hash = "events"; return; } render(); }, 220); } });
window.addEventListener("hashchange", route);

/* ═════════ ĐĂNG NHẬP ═════════ */
function renderLogin(msg){
  var email = LS.get("mmh_last_email") || "";
  $("#app").innerHTML = '<div class="login"><form class="card" id="lg" novalidate><h1>Sự kiện MKT</h1><p>Đăng nhập bằng email công ty. Mã 6 số sẽ được gửi vào hộp thư của bạn. Đã đăng nhập Report Hub hoặc CRM trên trình duyệt này thì không cần đăng nhập lại.</p>' +
    '<div class="row2" id="lg-s1"><label class="fl" for="lg-email">Email công ty</label><input class="in" id="lg-email" type="email" autocomplete="email" value="' + esc(email) + '" placeholder="ten@manimedicalhanoi.com"><button class="btn pri" id="lg-send" type="submit">Gửi mã đăng nhập</button></div>' +
    '<div class="row2" id="lg-s2" hidden><label class="fl" for="lg-code">Mã 6 số trong email</label><input class="in codein" id="lg-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn pri" id="lg-ok" type="submit">Đăng nhập</button><button class="btn ghost" type="button" id="lg-back">Đổi email</button></div>' +
    '<p class="err" id="lg-err">' + esc(msg || "") + "</p></form></div>";
  var step = 1;
  $("#lg-back").onclick = function(){ step = 1; $("#lg-s1").hidden = false; $("#lg-s2").hidden = true; };
  $("#lg").onsubmit = function(ev){
    ev.preventDefault(); var err = $("#lg-err"), em = $("#lg-email").value.trim(); err.textContent = "";
    if (step === 1){
      if (!/@/.test(em)){ err.textContent = "Nhập email công ty."; return; }
      $("#lg-send").disabled = true; $("#lg-send").textContent = "Đang gửi…";
      AUTH.hub("rhAuthStart", { email: em }).then(function(d){ $("#lg-send").disabled = false; $("#lg-send").textContent = "Gửi mã đăng nhập";
        if (!d.ok){ err.textContent = d.error || "Không gửi được mã."; return; } step = 2; $("#lg-s1").hidden = true; $("#lg-s2").hidden = false; $("#lg-code").focus(); })
        .catch(function(e){ $("#lg-send").disabled = false; $("#lg-send").textContent = "Gửi mã đăng nhập"; err.textContent = e.message; });
    } else {
      var code = $("#lg-code").value.replace(/\D/g, ""); if (code.length !== 6){ err.textContent = "Mã gồm 6 chữ số."; return; }
      $("#lg-ok").disabled = true;
      AUTH.hub("rhAuthVerify", { email: em, code: code }).then(function(d){ $("#lg-ok").disabled = false;
        if (!d.ok){ err.textContent = d.error || "Mã không đúng."; return; } AUTH.save(d); boot(false); })
        .catch(function(e){ $("#lg-ok").disabled = false; err.textContent = e.message; });
    }
  };
}

/* ═════════ KHỞI ĐỘNG ═════════ */
function boot(manual){
  if (!window.EH_DEMO && !AUTH.get()){ renderLogin(); return; }
  if (!S.D) $("#app").innerHTML = shell() + '<main class="wrap"><div class="panel" style="padding:18px"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div><p class="muted" style="margin-top:12px">Đang tải sự kiện…</p></main>';
  var sy = $("#sync"); if (sy) sy.classList.add("spin");
  return api("ehBoot", {}).then(function(d){
    if (!d || !d.ok) throw new Error(d && d.error || "Không tải được dữ liệu");
    var keepPending = S.D ? S.D.files.filter(function(f){ return /^tmp-/.test(f.id); }) : [];
    S.D = d; S.D.files = (d.files || []).concat(keepPending); S.me = d.me; S.loadedAt = Date.now();
    if (!S.routed){ S.routed = true; route(); } else render();
    if (manual) toast("Đã tải dữ liệu mới");
  }).catch(function(err){
    if (!S.D) $("#app").innerHTML = shell() + '<main class="wrap"><div class="panel"><p class="empty">Không tải được dữ liệu: ' + esc(err.message) + '. <button class="btn sm" onclick="location.reload()">Thử lại</button></p></div></main>';
    else toast(err.message, true);
  }).then(function(){ var s2 = $("#sync"); if (s2) s2.classList.remove("spin"); });
}
setInterval(function(){ if (document.visibilityState === "visible" && S.D && !S.drawer && Date.now() - S.loadedAt > 90000) boot(false); else if ($("#syncT") && S.loadedAt) $("#syncT").textContent = "Cập nhật " + ago(new Date(S.loadedAt).toISOString()); }, 30000);
window.EH = { S: S, boot: boot, render: render };
boot(false);
})();
</script>
